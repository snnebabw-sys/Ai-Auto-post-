<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AfriToon AI</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #10141b;
    color: white;
}

.container {
    max-width: 850px;
    margin: auto;
    padding: 25px;
}

h1 {
    font-size: 36px;
    margin-bottom: 5px;
}

.subtitle {
    color: #aab3c0;
    margin-bottom: 25px;
}

.card {
    background: #181e27;
    border: 1px solid #303846;
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 18px;
}

label {
    display: block;
    margin: 15px 0 7px;
}

select,
input,
textarea {
    width: 100%;
    padding: 13px;
    border-radius: 10px;
    border: 1px solid #3b4554;
    background: #0f141b;
    color: white;
    font-size: 16px;
}

textarea {
    min-height: 100px;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 18px;
    border: 0;
    border-radius: 10px;
    background: #ff3b30;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: 0.6;
}

button:active {
    transform: scale(.98);
}

.status {
    white-space: pre-wrap;
    color: #c8d0da;
    line-height: 1.6;
}

.warning {
    color: #ffcc66;
    font-size: 14px;
}

.story-box {
    display: none;
}

.story-title {
    font-size: 24px;
    margin-bottom: 10px;
}

.character {
    background: #10141b;
    padding: 12px;
    border-radius: 10px;
    margin-top: 10px;
}

.scene {
    background: #10141b;
    padding: 15px;
    border-radius: 10px;
    margin-top: 12px;
}

.dialogue {
    margin-top: 8px;
    padding: 8px;
    border-left: 3px solid #ff3b30;
}
</style>
</head>

<body>

<div class="container">

<h1>🎬 AfriToon AI</h1>

<div class="subtitle">
Create original African cartoon stories with talking characters.
</div>

<div class="card">

<label>Story type</label>

<select id="category">
    <option value="surprise">Surprise Me 🎲</option>
    <option value="love">Love ❤️</option>
    <option value="comedy">Comedy 😂</option>
    <option value="education">Education 📚</option>
    <option value="history">African History 🌍</option>
    <option value="family">Family 👨‍👩‍👧</option>
    <option value="animal">Animal Adventure 🦁</option>
    <option value="love-comedy">Love + Comedy ❤️😂</option>
    <option value="education-comedy">Education + Comedy 📚😂</option>
    <option value="history-comedy">History + Comedy 🌍😂</option>
</select>

<label>Video length</label>

<select id="duration">
    <option value="60">1 minute</option>
    <option value="180">3 minutes</option>
    <option value="300">5 minutes</option>
</select>

<label>Story idea (optional)</label>

<textarea
id="topic"
placeholder="Example: A poor young man falls in love with a successful businesswoman..."></textarea>

<label>Language</label>

<select id="language">
    <option value="English">English</option>
    <option value="Simple English">Simple English</option>
    <option value="Nigerian Pidgin">Nigerian Pidgin</option>
</select>

<button id="createButton" onclick="createStory()">
✨ CREATE CARTOON
</button>

</div>

<div class="card">

<h2>📺 Status</h2>

<div id="status" class="status">
Ready.
</div>

</div>

<div class="card story-box" id="storyBox">

<h2>📖 Generated Story</h2>

<div id="storyContent"></div>

</div>

<div class="card">

<p class="warning">
🔐 Your Gemini and YouTube keys stay on the secure Render
backend. Never put them inside this HTML file.
</p>

</div>

</div>


<script>

/* YOUR RENDER BACKEND */
const BACKEND_URL =
    "https://ai-auto-post-61wi.onrender.com";


async function createStory() {

    const category =
        document.getElementById("category").value;

    const duration =
        document.getElementById("duration").value;

    const topic =
        document.getElementById("topic").value;

    const language =
        document.getElementById("language").value;

    const status =
        document.getElementById("status");

    const button =
        document.getElementById("createButton");

    const storyBox =
        document.getElementById("storyBox");

    const storyContent =
        document.getElementById("storyContent");


    button.disabled = true;

    button.textContent =
        "⏳ CREATING STORY...";

    storyBox.style.display = "none";


    status.textContent =
`Connecting to AfriToon AI...

🤖 Asking the AI to create your original story...`;


    try {

        const response = await fetch(
            BACKEND_URL + "/api/generate",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    category: category,

                    topic: topic,

                    duration: duration,

                    language: language,

                    style: "funny and entertaining"

                })
            }
        );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "The backend returned an error."
            );

        }


        if (!data.success || !data.story) {

            throw new Error(
                "The AI did not return a story."
            );

        }


        displayStory(data.story);


        status.textContent =
`✅ STORY CREATED!

The AI successfully generated the story.

Next stage:
🎭 Characters
🎙️ Voices
🎬 Animation
🎵 Music
📝 Subtitles
📺 YouTube

For now, we are testing the story engine first.`;


    } catch (error) {

        console.error(error);


        status.textContent =
`❌ ERROR

${error.message}

Check your Render logs and make sure:
• GEMINI_API_KEY is added to Render
• Render is showing LIVE
• The backend is running`;


    } finally {

        button.disabled = false;

        button.textContent =
            "✨ CREATE CARTOON";

    }

}


function displayStory(story) {

    const storyBox =
        document.getElementById("storyBox");

    const storyContent =
        document.getElementById("storyContent");


    let html = "";


    html += `
        <div class="story-title">
            ${escapeHTML(story.title || "Untitled Story")}
        </div>
    `;


    if (story.description) {

        html += `
            <p>
                ${escapeHTML(story.description)}
            </p>
        `;

    }


    if (story.characters) {

        html += `
            <h3>🎭 Characters</h3>
        `;


        story.characters.forEach(character => {

            html += `
                <div class="character">

                    <strong>
                        ${escapeHTML(character.name)}
                    </strong>

                    <br>

                    Personality:
                    ${escapeHTML(character.personality || "")}

                    <br>

                    Voice:
                    ${escapeHTML(character.voice || "")}

                </div>
            `;

        });

    }


    if (story.scenes) {

        html += `
            <h3 style="margin-top:20px;">
                🎬 Scenes
            </h3>
        `;


        story.scenes.forEach(scene => {

            html += `
                <div class="scene">

                    <strong>
                        Scene ${scene.scene}
                    </strong>

                    <p>
                        📍 ${escapeHTML(scene.location || "")}
                    </p>

                    <p>
                        🎭 ${escapeHTML(scene.visual_action || "")}
                    </p>
            `;


            if (scene.dialogue) {

                scene.dialogue.forEach(line => {

                    html += `
                        <div class="dialogue">

                            <strong>
                                ${escapeHTML(line.character)}
                            </strong>:

                            ${escapeHTML(line.line)}

                            <br>

                            <small>
                                Emotion:
                                ${escapeHTML(line.emotion || "")}
                            </small>

                        </div>
                    `;

                });

            }


            html += `
                </div>
            `;

        });

    }


    storyContent.innerHTML = html;

    storyBox.style.display = "block";

}


function escapeHTML(value) {

    if (value === undefined || value === null) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

</script>

</body>
</html>
