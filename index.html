<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>AfriToon Studio</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f6f8;
    color: #20242a;
}

.container {
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
    padding: 30px 20px 50px;
}

.header {
    margin-bottom: 28px;
}

.logo {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.5px;
}

.subtitle {
    color: #707780;
    margin-top: 7px;
    font-size: 15px;
}

.card {
    background: #ffffff;
    border: 1px solid #e1e4e8;
    border-radius: 12px;
    padding: 22px;
    margin-bottom: 18px;
}

h2 {
    margin-top: 0;
    font-size: 19px;
}

label {
    display: block;
    margin: 17px 0 7px;
    font-size: 14px;
    font-weight: 600;
}

select,
textarea {
    width: 100%;
    padding: 12px 13px;
    border: 1px solid #ccd1d7;
    border-radius: 8px;
    background: #fff;
    color: #20242a;
    font-size: 15px;
    outline: none;
}

select:focus,
textarea:focus {
    border-color: #777f88;
}

textarea {
    min-height: 105px;
    resize: vertical;
}

.primary-button {
    width: 100%;
    margin-top: 20px;
    padding: 13px 16px;
    border: 0;
    border-radius: 8px;
    background: #22262b;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
}

.primary-button:hover {
    background: #111417;
}

.primary-button:disabled {
    opacity: 0.55;
    cursor: not-allowed;
}

.status {
    color: #626970;
    line-height: 1.6;
    font-size: 14px;
    white-space: pre-wrap;
}

.story-box,
.video-box {
    display: none;
}

.story-title {
    font-size: 23px;
    font-weight: 700;
    margin-bottom: 10px;
}

.character {
    background: #f7f8f9;
    border: 1px solid #e5e7ea;
    border-radius: 8px;
    padding: 13px;
    margin-top: 10px;
    line-height: 1.6;
    font-size: 14px;
}

.scene {
    background: #f7f8f9;
    border: 1px solid #e5e7ea;
    border-radius: 8px;
    padding: 15px;
    margin-top: 12px;
    font-size: 14px;
}

.dialogue {
    margin-top: 9px;
    padding: 9px 11px;
    border-left: 3px solid #777f88;
    background: #ffffff;
    border-radius: 4px;
    line-height: 1.5;
}

.video-box video {
    width: 100%;
    max-width: 500px;
    display: block;
    margin: 15px auto;
    border-radius: 10px;
    background: #000;
}

.download-button {
    display: block;
    width: 100%;
    text-align: center;
    text-decoration: none;
    background: #22262b;
    color: #fff;
    padding: 13px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    margin-top: 12px;
}

.download-button:hover {
    background: #111417;
}

.open-button {
    display: block;
    width: 100%;
    text-align: center;
    text-decoration: none;
    background: #f1f2f4;
    color: #20242a;
    padding: 13px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    margin-top: 10px;
}

.small-text {
    color: #858c94;
    font-size: 13px;
    line-height: 1.5;
}

.error-text {
    color: #b42318;
}

.success-text {
    color: #18794e;
}

</style>

</head>


<body>


<div class="container">


    <div class="header">

        <div class="logo">
            AfriToon Studio
        </div>

        <div class="subtitle">
            Create short animated stories and videos.
        </div>

    </div>


    <!-- SETTINGS -->

    <div class="card">

        <label for="category">
            Story type
        </label>

        <select id="category">

            <option value="surprise">
                Surprise Me
            </option>

            <option value="love">
                Love
            </option>

            <option value="comedy">
                Comedy
            </option>

            <option value="education">
                Education
            </option>

            <option value="history">
                African History
            </option>

            <option value="family">
                Family
            </option>

            <option value="animal">
                Animal Adventure
            </option>

            <option value="love-comedy">
                Love + Comedy
            </option>

            <option value="education-comedy">
                Education + Comedy
            </option>

            <option value="history-comedy">
                History + Comedy
            </option>

        </select>


        <label for="duration">
            Video length
        </label>

        <select id="duration">

            <option value="30">
                30 seconds
            </option>

            <option value="60">
                1 minute
            </option>

        </select>


        <label for="topic">
            Story idea
        </label>

        <textarea
            id="topic"
            placeholder="Describe your story idea, or leave this field empty."
        ></textarea>


        <label for="language">
            Language
        </label>

        <select id="language">

            <option value="English">
                English
            </option>

            <option value="Simple English">
                Simple English
            </option>

            <option value="Nigerian Pidgin">
                Nigerian Pidgin
            </option>

        </select>


        <button
            id="createButton"
            class="primary-button"
            onclick="createStory()"
        >
            Create video
        </button>

    </div>


    <!-- STATUS -->

    <div class="card">

        <h2>
            Progress
        </h2>

        <div
            id="status"
            class="status"
        >
            Ready to create a video.
        </div>

    </div>


    <!-- STORY -->

    <div
        class="card story-box"
        id="storyBox"
    >

        <h2>
            Story
        </h2>

        <div id="storyContent"></div>

    </div>


    <!-- VIDEO -->

    <div
        class="card video-box"
        id="videoBox"
    >

        <h2>
            Preview
        </h2>


        <video
            id="videoPreview"
            controls
            playsinline
            preload="metadata"
        ></video>


        <a
            id="downloadButton"
            class="download-button"
            href="#"
        >
            Download video
        </a>


        <a
            id="openButton"
            class="open-button"
            href="#"
            target="_blank"
            rel="noopener"
        >
            Open video
        </a>

    </div>


    <div class="card">

        <p class="small-text">

            Videos are created from the story settings you provide.
            You can preview the finished video before saving it.

        </p>

    </div>


</div>


<script>


/* ============================================================
   BACKEND
============================================================ */

const BACKEND_URL =
    "https://ai-auto-post-61wi.onrender.com";


/* ============================================================
   CREATE STORY
============================================================ */

async function createStory() {

    const category =
        document.getElementById(
            "category"
        ).value;


    const duration =
        document.getElementById(
            "duration"
        ).value;


    const topic =
        document.getElementById(
            "topic"
        ).value.trim();


    const language =
        document.getElementById(
            "language"
        ).value;


    const status =
        document.getElementById(
            "status"
        );


    const button =
        document.getElementById(
            "createButton"
        );


    const storyBox =
        document.getElementById(
            "storyBox"
        );


    const videoBox =
        document.getElementById(
            "videoBox"
        );


    button.disabled =
        true;


    button.textContent =
        "Creating...";


    storyBox.style.display =
        "none";


    videoBox.style.display =
        "none";


    status.className =
        "status";


    status.textContent =
        "Preparing your story...";


    try {

        const response =
            await fetch(
                BACKEND_URL +
                "/api/generate",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        category:
                            category,

                        topic:
                            topic,

                        duration:
                            Number(duration),

                        language:
                            language,

                        style:
                            "funny and entertaining"

                    })
                }
            );


        const data =
            await parseJSON(
                response
            );


        if (!response.ok) {

            throw new Error(
                data.error ||
                data.message ||
                "Unable to create the story."
            );

        }


        if (
            !data.success ||
            !data.story
        ) {

            throw new Error(
                "No story was returned by the server."
            );

        }


        displayStory(
            data.story
        );


        status.textContent =
            "Story prepared.\n\n" +
            "Creating the video...\n" +
            "Characters and scenes are being prepared.";


        await createVideo(
            data.story,
            duration
        );


    } catch (error) {

        console.error(
            "CREATE ERROR:",
            error
        );


        status.className =
            "status error-text";


        status.textContent =
            "Something went wrong.\n\n" +
            error.message;


    } finally {

        button.disabled =
            false;


        button.textContent =
            "Create video";

    }

}


/* ============================================================
   CREATE VIDEO
============================================================ */

async function createVideo(
    story,
    duration
) {

    const status =
        document.getElementById(
            "status"
        );


    status.className =
        "status";


    status.textContent =
        "Creating your video...\n\n" +
        "Preparing characters...\n" +
        "Preparing voices...\n" +
        "Rendering scenes...";


    const response =
        await fetch(
            BACKEND_URL +
            "/api/create-video",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({

                    story:
                        story,

                    duration:
                        Number(duration)

                })
            }
        );


    const data =
        await parseJSON(
            response
        );


    console.log(
        "CREATE VIDEO RESPONSE:",
        data
    );


    if (!response.ok) {

        throw new Error(
            data.error ||
            data.message ||
            "Unable to start video creation."
        );

    }


    if (!data.job_id) {

        throw new Error(
            "The server did not return a video job ID."
        );

    }


    status.textContent =
        "Video job started.\n\n" +
        "Rendering your video...";


    await monitorVideo(
        data.job_id
    );

}


/* ============================================================
   MONITOR VIDEO
============================================================ */

async function monitorVideo(
    jobId
) {

    const status =
        document.getElementById(
            "status"
        );


    let attempts = 0;


    const maxAttempts = 300;


    const pollInterval = 2500;


    while (
        attempts <
        maxAttempts
    ) {

        attempts++;


        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    pollInterval
                )
        );


        let response;


        try {

            response =
                await fetch(
                    BACKEND_URL +
                    "/api/video-status/" +
                    encodeURIComponent(
                        jobId
                    ) +
                    "?t=" +
                    Date.now(),
                    {
                        method: "GET",

                        cache:
                            "no-store"
                    }
                );


        } catch (networkError) {

            console.error(
                "STATUS NETWORK ERROR:",
                networkError
            );


            status.textContent =
                "Waiting for the video server...\n\n" +
                "Attempt " +
                attempts +
                " of " +
                maxAttempts;


            continue;

        }


        const data =
            await parseJSON(
                response
            );


        console.log(
            "VIDEO STATUS:",
            data
        );


        if (!response.ok) {

            throw new Error(
                data.error ||
                data.message ||
                "Unable to check video progress."
            );

        }


        /* ====================================================
           FAILED
        ==================================================== */

        if (
            data.status ===
            "failed" ||

            data.status ===
            "error"
        ) {

            throw new Error(
                data.error ||
                data.message ||
                "Video creation failed."
            );

        }


        /* ====================================================
           COMPLETED
        ==================================================== */

        if (
            data.status ===
            "complete" ||

            data.status ===
            "completed" ||

            data.status ===
            "done" ||

            data.status ===
            "success"
        ) {

            const videoUrl =
                data.video_url ||
                data.url ||
                data.video ||
                data.file_url;


            const downloadUrl =
                data.download_url ||
                videoUrl;


            if (!videoUrl) {

                status.textContent =
                    "Video finished.\n\n" +
                    "Waiting for the video file...";

                continue;

            }


            status.className =
                "status success-text";


            status.textContent =
                "Your video is ready.";


            showVideo(
                videoUrl,
                downloadUrl
            );


            return;

        }


        /* ====================================================
           PROCESSING
        ==================================================== */

        const progress =
            data.progress !== undefined
                ? "\nProgress: " +
                  data.progress +
                  "%"
                : "";


        status.textContent =
            "Creating your video...\n\n" +
            (
                data.message ||
                "Rendering scenes..."
            ) +
            progress;

    }


    throw new Error(
        "Video creation is taking longer than expected. Please try again."
    );

}


/* ============================================================
   SHOW VIDEO
============================================================ */

function showVideo(
    videoUrl,
    downloadUrl
) {

    const videoBox =
        document.getElementById(
            "videoBox"
        );


    const video =
        document.getElementById(
            "videoPreview"
        );


    const download =
        document.getElementById(
            "downloadButton"
        );


    const open =
        document.getElementById(
            "openButton"
        );


    if (!videoUrl) {

        throw new Error(
            "No video URL was returned."
        );

    }


    let fullVideoUrl;


    /*
     * Absolute URL
     */

    if (
        videoUrl.startsWith(
            "http://"
        ) ||

        videoUrl.startsWith(
            "https://"
        )
    ) {

        fullVideoUrl =
            videoUrl;

    }


    /*
     * Relative URL
     */

    else {

        if (
            !videoUrl.startsWith("/")
        ) {

            videoUrl =
                "/" +
                videoUrl;

        }


        fullVideoUrl =
            BACKEND_URL +
            videoUrl;

    }


    let fullDownloadUrl;


    /*
     * DOWNLOAD URL
     */

    if (
        downloadUrl &&
        (
            downloadUrl.startsWith(
                "http://"
            ) ||

            downloadUrl.startsWith(
                "https://"
            )
        )
    ) {

        fullDownloadUrl =
            downloadUrl;

    } else if (downloadUrl) {

        if (
            !downloadUrl.startsWith("/")
        ) {

            downloadUrl =
                "/" +
                downloadUrl;

        }


        fullDownloadUrl =
            BACKEND_URL +
            downloadUrl;

    } else {

        fullDownloadUrl =
            fullVideoUrl;

    }


    /*
     * Cache bust
     */

    const previewUrl =
        fullVideoUrl +
        (
            fullVideoUrl.includes("?")
                ? "&"
                : "?"
        ) +
        "v=" +
        Date.now();


    console.log(
        "VIDEO URL:",
        fullVideoUrl
    );


    console.log(
        "DOWNLOAD URL:",
        fullDownloadUrl
    );


    /*
     * Reset previous video
     */

    video.pause();


    video.removeAttribute(
        "src"
    );


    video.load();


    /*
     * Set new video
     */

    video.src =
        previewUrl;


    /*
     * Download button
     */

    download.href =
        fullDownloadUrl;


    download.setAttribute(
        "download",
        ""
    );


    /*
     * Open button
     */

    open.href =
        fullVideoUrl;


    /*
     * Show video box
     */

    videoBox.style.display =
        "block";


    /*
     * Scroll to video
     */

    setTimeout(
        () => {

            videoBox.scrollIntoView({
                behavior: "smooth",
                block: "start"
            });

        },
        100
    );


    /*
     * Video loading error
     */

    video.onerror =
        function () {

            console.error(
                "VIDEO LOAD ERROR:",
                fullVideoUrl
            );


            const status =
                document.getElementById(
                    "status"
                );


            status.className =
                "status error-text";


            status.textContent =
                "The MP4 was created, but the browser could not load it.\n\n" +
                "Try the 'Open video' button below.";

        };


    /*
     * Video loaded
     */

    video.onloadedmetadata =
        function () {

            console.log(
                "VIDEO LOADED:",
                fullVideoUrl
            );


            const status =
                document.getElementById(
                    "status"
                );


            status.className =
                "status success-text";


            status.textContent =
                "Your video is ready.\n\n" +
                "You can play it or download it.";

        };

}


/* ============================================================
   DISPLAY STORY
============================================================ */

function displayStory(
    story
) {

    const storyBox =
        document.getElementById(
            "storyBox"
        );


    const storyContent =
        document.getElementById(
            "storyContent"
        );


    let html = "";


    html += `
        <div class="story-title">
            ${escapeHTML(
                story.title ||
                "Untitled Story"
            )}
        </div>
    `;


    if (
        story.description
    ) {

        html += `
            <p>
                ${escapeHTML(
                    story.description
                )}
            </p>
        `;

    }


    /*
     * CHARACTERS
     */

    if (
        story.characters &&
        Array.isArray(
            story.characters
        )
    ) {

        html += `
            <h3>
                Characters
            </h3>
        `;


        story.characters.forEach(
            character => {

                html += `
                    <div class="character">

                        <strong>
                            ${escapeHTML(
                                character.name ||
                                "Character"
                            )}
                        </strong>

                        <br>

                        Personality:
                        ${escapeHTML(
                            character.personality ||
                            ""
                        )}

                        <br>

                        Voice:
                        ${escapeHTML(
                            character.voice ||
                            ""
                        )}

                    </div>
                `;

            }
        );

    }


    /*
     * SCENES
     */

    if (
        story.scenes &&
        Array.isArray(
            story.scenes
        )
    ) {

        html += `
            <h3
                style="margin-top:22px;">
                Scenes
            </h3>
        `;


        story.scenes.forEach(
            scene => {

                html += `
                    <div class="scene">

                        <strong>
                            Scene
                            ${escapeHTML(
                                scene.scene ||
                                ""
                            )}
                        </strong>

                        <p>
                            ${escapeHTML(
                                scene.location ||
                                ""
                            )}
                        </p>

                        <p>
                            ${escapeHTML(
                                scene.action ||
                                scene.visual_action ||
                                ""
                            )}
                        </p>
                `;


                /*
                 * DIALOGUE
                 */

                if (
                    scene.dialogue &&
                    Array.isArray(
                        scene.dialogue
                    )
                ) {

                    scene.dialogue.forEach(
                        line => {

                            html += `
                                <div class="dialogue">

                                    <strong>
                                        ${escapeHTML(
                                            line.character ||
                                            ""
                                        )}
                                    </strong>

                                    :
                                    ${escapeHTML(
                                        line.text ||
                                        line.line ||
                                        ""
                                    )}

                                    <br>

                                    <small>
                                        Emotion:
                                        ${escapeHTML(
                                            line.emotion ||
                                            ""
                                        )}
                                    </small>

                                </div>
                            `;

                        }
                    );

                }


                html += `
                    </div>
                `;

            }
        );

    }


    storyContent.innerHTML =
        html;


    storyBox.style.display =
        "block";

}


/* ============================================================
   SAFE JSON RESPONSE
============================================================ */

async function parseJSON(
    response
) {

    const text =
        await response.text();


    if (!text) {

        return {};

    }


    try {

        return JSON.parse(
            text
        );

    } catch (error) {

        console.error(
            "Invalid JSON response:",
            text
        );


        throw new Error(
            "The server returned an invalid response."
        );

    }

}


/* ============================================================
   ESCAPE HTML
============================================================ */

function escapeHTML(
    value
) {

    if (
        value === undefined ||
        value === null
    ) {

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}

</script>

</body>
</html>
