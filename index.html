<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AfriToon Studio</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f6f8;
    color: #20242a;
}

.container {
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
    padding: 30px 20px 50px;
}

.header {
    margin-bottom: 28px;
}

.logo {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.5px;
}

.subtitle {
    color: #707780;
    margin-top: 7px;
    font-size: 15px;
}

.card {
    background: #ffffff;
    border: 1px solid #e1e4e8;
    border-radius: 12px;
    padding: 22px;
    margin-bottom: 18px;
}

h2 {
    margin-top: 0;
    font-size: 19px;
}

label {
    display: block;
    margin: 17px 0 7px;
    font-size: 14px;
    font-weight: 600;
}

select,
textarea {
    width: 100%;
    padding: 12px 13px;
    border: 1px solid #ccd1d7;
    border-radius: 8px;
    background: #fff;
    color: #20242a;
    font-size: 15px;
    outline: none;
}

select:focus,
textarea:focus {
    border-color: #777f88;
}

textarea {
    min-height: 105px;
    resize: vertical;
}

.primary-button {
    width: 100%;
    margin-top: 20px;
    padding: 13px 16px;
    border: 0;
    border-radius: 8px;
    background: #22262b;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
}

.primary-button:hover {
    background: #111417;
}

.primary-button:disabled {
    opacity: 0.55;
    cursor: not-allowed;
}

.status {
    color: #626970;
    line-height: 1.6;
    font-size: 14px;
    white-space: pre-wrap;
}

.story-box,
.video-box {
    display: none;
}

.story-title {
    font-size: 23px;
    font-weight: 700;
    margin-bottom: 10px;
}

.character {
    background: #f7f8f9;
    border: 1px solid #e5e7ea;
    border-radius: 8px;
    padding: 13px;
    margin-top: 10px;
    line-height: 1.6;
    font-size: 14px;
}

.scene {
    background: #f7f8f9;
    border: 1px solid #e5e7ea;
    border-radius: 8px;
    padding: 15px;
    margin-top: 12px;
    font-size: 14px;
}

.dialogue {
    margin-top: 9px;
    padding: 9px 11px;
    border-left: 3px solid #777f88;
    background: #ffffff;
    border-radius: 4px;
    line-height: 1.5;
}

.video-box video {
    width: 100%;
    max-width: 500px;
    display: block;
    margin: 15px auto;
    border-radius: 10px;
    background: #000;
}

.download-button {
    display: block;
    width: 100%;
    text-align: center;
    text-decoration: none;
    background: #22262b;
    color: #fff;
    padding: 13px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    margin-top: 12px;
}

.download-button:hover {
    background: #111417;
}

.small-text {
    color: #858c94;
    font-size: 13px;
    line-height: 1.5;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="logo">AfriToon Studio</div>

        <div class="subtitle">
            Create short animated stories and videos.
        </div>
    </div>


    <div class="card">

        <label for="category">
            Story type
        </label>

        <select id="category">
            <option value="surprise">Surprise Me</option>
            <option value="love">Love</option>
            <option value="comedy">Comedy</option>
            <option value="education">Education</option>
            <option value="history">African History</option>
            <option value="family">Family</option>
            <option value="animal">Animal Adventure</option>
            <option value="love-comedy">Love + Comedy</option>
            <option value="education-comedy">Education + Comedy</option>
            <option value="history-comedy">History + Comedy</option>
        </select>


        <label for="duration">
            Video length
        </label>

        <select id="duration">
            <option value="30">30 seconds</option>
            <option value="60">1 minute</option>
        </select>


        <label for="topic">
            Story idea
        </label>

        <textarea
            id="topic"
            placeholder="Describe your story idea, or leave this field empty."></textarea>


        <label for="language">
            Language
        </label>

        <select id="language">
            <option value="English">English</option>
            <option value="Simple English">Simple English</option>
            <option value="Nigerian Pidgin">Nigerian Pidgin</option>
        </select>


        <button
            id="createButton"
            class="primary-button"
            onclick="createStory()">

            Create video

        </button>

    </div>


    <div class="card">

        <h2>Progress</h2>

        <div
            id="status"
            class="status">

            Ready to create a video.

        </div>

    </div>


    <div
        class="card story-box"
        id="storyBox">

        <h2>Story</h2>

        <div id="storyContent"></div>

    </div>


    <div
        class="card video-box"
        id="videoBox">

        <h2>Preview</h2>

        <video
            id="videoPreview"
            controls
            playsinline>
        </video>


        <a
            id="downloadButton"
            class="download-button"
            download>

            Download video

        </a>

    </div>


    <div class="card">

        <p class="small-text">
            Videos are created from the story settings you provide.
            You can preview the finished video before saving it.
        </p>

    </div>

</div>


<script>

const BACKEND_URL =
    "https://ai-auto-post-61wi.onrender.com";


async function createStory() {

    const category =
        document.getElementById("category").value;

    const duration =
        document.getElementById("duration").value;

    const topic =
        document.getElementById("topic").value;

    const language =
        document.getElementById("language").value;

    const status =
        document.getElementById("status");

    const button =
        document.getElementById("createButton");

    const storyBox =
        document.getElementById("storyBox");

    const videoBox =
        document.getElementById("videoBox");


    button.disabled = true;

    button.textContent =
        "Creating...";

    storyBox.style.display =
        "none";

    videoBox.style.display =
        "none";


    status.textContent =
        "Preparing your story...";


    try {

        const response =
            await fetch(
                BACKEND_URL + "/api/generate",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        category:
                            category,

                        topic:
                            topic,

                        duration:
                            duration,

                        language:
                            language,

                        style:
                            "funny and entertaining"

                    })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Unable to create the story."
            );

        }


        if (
            !data.success ||
            !data.story
        ) {

            throw new Error(
                "No story was returned."
            );

        }


        displayStory(
            data.story
        );


        status.textContent =
            "Story prepared.\n\n" +
            "Creating the video...\n" +
            "Characters and scenes are being prepared.";


        await createVideo(
            data.story,
            duration
        );


    } catch (error) {

        console.error(error);

        status.textContent =
            "Something went wrong.\n\n" +
            error.message;

    } finally {

        button.disabled =
            false;

        button.textContent =
            "Create video";

    }

}


async function createVideo(
    story,
    duration
) {

    const status =
        document.getElementById(
            "status"
        );


    status.textContent =
        "Creating your video...\n\n" +
        "Preparing characters...\n" +
        "Preparing voices...\n" +
        "Rendering scenes...";


    const response =
        await fetch(
            BACKEND_URL +
            "/api/create-video",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({

                    story:
                        story,

                    duration:
                        Number(duration)

                })
            }
        );


    const data =
        await response.json();


    if (!response.ok) {

        throw new Error(
            data.error ||
            "Unable to start video creation."
        );

    }


    if (!data.job_id) {

        throw new Error(
            "No video job was created."
        );

    }


    await monitorVideo(
        data.job_id
    );

}


async function monitorVideo(
    jobId
) {

    const status =
        document.getElementById(
            "status"
        );


    let attempts = 0;

    const maxAttempts = 200;


    while (
        attempts <
        maxAttempts
    ) {

        attempts++;


        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    2500
                )
        );


        const response =
            await fetch(
                BACKEND_URL +
                "/api/video-status/" +
                encodeURIComponent(
                    jobId
                )
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Unable to check video progress."
            );

        }


        if (
            data.status ===
            "processing"
        ) {

            status.textContent =
                "Creating your video...\n\n" +
                (
                    data.message ||
                    "Rendering scenes..."
                );

        }


        else if (
            data.status ===
            "completed"
        ) {

            status.textContent =
                "Your video is ready.";

            showVideo(
                data.video_url
            );

            return;

        }


        else if (
            data.status ===
            "failed"
        ) {

            throw new Error(
                data.error ||
                "Video creation failed."
            );

        }

    }


    throw new Error(
        "Video creation is taking longer than expected."
    );

}


function showVideo(
    videoUrl
) {

    const videoBox =
        document.getElementById(
            "videoBox"
        );

    const video =
        document.getElementById(
            "videoPreview"
        );

    const download =
        document.getElementById(
            "downloadButton"
        );


    let fullUrl;


    if (
        videoUrl.startsWith(
            "http"
        )
    ) {

        fullUrl =
            videoUrl;

    } else {

        fullUrl =
            BACKEND_URL +
            videoUrl;

    }


    video.src =
        fullUrl;

    download.href =
        fullUrl;


    videoBox.style.display =
        "block";


    videoBox.scrollIntoView({
        behavior: "smooth"
    });

}


function displayStory(
    story
) {

    const storyBox =
        document.getElementById(
            "storyBox"
        );

    const storyContent =
        document.getElementById(
            "storyContent"
        );


    let html = "";


    html += `
        <div class="story-title">
            ${escapeHTML(
                story.title ||
                "Untitled Story"
            )}
        </div>
    `;


    if (story.description) {

        html += `
            <p>
                ${escapeHTML(
                    story.description
                )}
            </p>
        `;

    }


    if (
        story.characters &&
        Array.isArray(
            story.characters
        )
    ) {

        html += `
            <h3>
                Characters
            </h3>
        `;


        story.characters.forEach(
            character => {

                html += `
                    <div class="character">

                        <strong>
                            ${escapeHTML(
                                character.name
                            )}
                        </strong>

                        <br>

                        Personality:
                        ${escapeHTML(
                            character.personality ||
                            ""
                        )}

                        <br>

                        Voice:
                        ${escapeHTML(
                            character.voice ||
                            ""
                        )}

                    </div>
                `;

            }
        );

    }


    if (
        story.scenes &&
        Array.isArray(
            story.scenes
        )
    ) {

        html += `
            <h3
                style="margin-top:22px;">
                Scenes
            </h3>
        `;


        story.scenes.forEach(
            scene => {

                html += `
                    <div class="scene">

                        <strong>
                            Scene
                            ${escapeHTML(
                                scene.scene
                            )}
                        </strong>

                        <p>
                            ${escapeHTML(
                                scene.location ||
                                ""
                            )}
                        </p>

                        <p>
                            ${escapeHTML(
                                scene.visual_action ||
                                ""
                            )}
                        </p>
                `;


                if (
                    scene.dialogue &&
                    Array.isArray(
                        scene.dialogue
                    )
                ) {

                    scene.dialogue.forEach(
                        line => {

                            html += `
                                <div class="dialogue">

                                    <strong>
                                        ${escapeHTML(
                                            line.character
                                        )}
                                    </strong>

                                    :
                                    ${escapeHTML(
                                        line.line
                                    )}

                                    <br>

                                    <small>
                                        Emotion:
                                        ${escapeHTML(
                                            line.emotion ||
                                            ""
                                        )}
                                    </small>

                                </div>
                            `;

                        }
                    );

                }


                html += `
                    </div>
                `;

            }
        );

    }


    storyContent.innerHTML =
        html;

    storyBox.style.display =
        "block";

}


function escapeHTML(
    value
) {

    if (
        value === undefined ||
        value === null
    ) {

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}

</script>

</body>
</html>
